<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cajun Waitlist">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cajun Crack'n — Join the Waitlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    background:#fafbfe;
    font-family:Arial,sans-serif; color:#1a1a1a;
    height:100%; overflow:hidden;
  }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:clamp(24px,4vh,56px) clamp(24px,5vw,64px); text-align:center;
  }
  #logo { margin-bottom:clamp(8px,1.5vh,18px); }
  #logo img { height:clamp(54px,10vw,120px); width:auto; display:block; margin:0 auto; }
  #logo::after {
    content:''; display:block; width:56px; height:2px; background:#1f2a56;
    margin:clamp(12px,2vh,18px) auto 0; border-radius:2px;
  }
  h1 {
    font-family:'Cormorant Garamond', Georgia, serif; font-weight:600;
    font-size:clamp(1.9rem,4.8vw,3.4rem); color:#1a1a1a; margin-bottom:clamp(20px,3vh,40px);
    letter-spacing:.01em;
  }
  #wait-count {
    font-size:clamp(.75rem,1.4vw,1.1rem); color:#1a1a1a; font-family:monospace; margin-bottom:clamp(18px,3vh,36px);
    border:1px solid #1f2a56; background:#e9edf7; border-radius:30px; padding:clamp(6px,1vh,12px) clamp(16px,2vw,28px);
  }
  .screen { display:none; width:100%; max-width:clamp(420px,70vw,760px); }
  .screen.show { display:flex; flex-direction:column; align-items:center; }

  label { display:block; font-size:clamp(.78rem,1.5vw,1.15rem); color:#5e6577; font-family:monospace;
    letter-spacing:.06em; margin:clamp(14px,2vh,26px) 0 clamp(8px,1.2vh,14px); align-self:flex-start; }
  #name-input {
    width:100%; font-size:clamp(1.1rem,2.6vw,1.8rem); padding:clamp(16px,2.6vh,28px); border-radius:14px;
    border:1.5px solid #1f2a56; background:#ffffff; color:#1a1a1a;
    font-family:Arial,sans-serif; text-align:center;
    box-shadow:0 1px 4px rgba(0,0,0,.05);
  }
  #name-input:focus { outline:none; border-color:#c8102e; }

  .party-row { display:flex; gap:clamp(8px,1.4vw,16px); flex-wrap:wrap; justify-content:center; width:100%; }
  .party-btn {
    width:clamp(52px,7.5vw,86px); height:clamp(50px,7vw,80px); border-radius:14px; border:1.5px solid #1f2a56;
    background:#ffffff; color:#1a1a1a; font-size:clamp(1.05rem,2vw,1.6rem); font-weight:bold;
    font-family:monospace; cursor:pointer; touch-action:manipulation;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .party-btn.sel { background:#1f2a56; border-color:#1f2a56; color:#ffffff; box-shadow:0 0 0 3px rgba(31,42,86,.25); }

  #phone-input {
    width:100%; font-size:clamp(1rem,2.2vw,1.5rem); padding:clamp(14px,2.2vh,24px); border-radius:14px;
    border:1.5px solid #1f2a56; background:#ffffff; color:#1a1a1a;
    font-family:Arial,sans-serif; text-align:center;
    box-shadow:0 1px 4px rgba(0,0,0,.05);
  }
  #phone-input:focus { outline:none; border-color:#c8102e; }

  #submit-btn {
    width:100%; margin-top:clamp(28px,4vh,48px); padding:clamp(18px,2.8vh,30px); font-size:clamp(1.1rem,2.6vw,1.8rem); font-weight:bold;
    border-radius:16px; background:#c8102e; color:#fff8ea;
    border:2px solid #1f2a56; cursor:pointer; touch-action:manipulation;
    font-family:monospace; letter-spacing:.05em;
    box-shadow:0 2px 8px rgba(200,16,46,.3);
  }
  #submit-btn:disabled { opacity:.35; border-color:#b9c0d6; color:#5e6577; background:#ffffff; box-shadow:none; }

  #err { color:#c8102e; font-size:clamp(.72rem,1.4vw,1.05rem); font-family:monospace; margin-top:clamp(10px,1.5vh,18px); min-height:14px; }

  /* Confirmation screen */
  #confirm-name {
    font-family:'Cormorant Garamond', Georgia, serif; font-weight:600;
    font-size:clamp(1.6rem,3.8vw,2.6rem); color:#1f2a56; margin-bottom:clamp(6px,1vh,12px);
  }
  #confirm-msg { font-size:clamp(.85rem,1.8vw,1.3rem); color:#5e6577; margin-bottom:clamp(18px,3vh,32px); }
  #confirm-pos {
    font-size:clamp(.95rem,2vw,1.4rem); color:#1a1a1a; font-family:monospace;
    border:1.5px solid #1f2a56; background:#ffffff; border-radius:16px;
    padding:clamp(14px,2.2vh,24px) clamp(22px,3.5vw,40px); margin-bottom:clamp(24px,3.5vh,40px);
  }
  #confirm-pos b { color:#c8102e; font-size:clamp(1.3rem,2.8vw,1.9rem); }
  #new-signin {
    padding:clamp(14px,2.2vh,22px) clamp(28px,4vw,48px); border-radius:14px; border:1.5px solid #1f2a56;
    background:#ffffff; color:#1a1a1a; font-family:monospace; font-size:clamp(.75rem,1.5vw,1.1rem);
    cursor:pointer; touch-action:manipulation;
  }
  #auto-note { font-size:clamp(.62rem,1.2vw,.9rem); color:#5e6577; font-family:monospace; margin-top:clamp(14px,2vh,24px); }

  /* Language toggle */
  #lang-toggle {
    position:fixed; top:clamp(14px,2.5vh,26px); right:clamp(14px,2.5vw,26px); z-index:50;
    font-family:monospace; font-size:clamp(.68rem,1.3vw,.95rem); font-weight:bold;
    padding:clamp(7px,1.2vh,12px) clamp(13px,2vw,20px); border-radius:20px;
    border:1.5px solid #1f2a56; background:#ffffff; color:#1a1a1a;
    cursor:pointer; touch-action:manipulation;
  }

  /* Notes chips */
  .chip-row { display:flex; gap:clamp(6px,1vw,12px); flex-wrap:wrap; justify-content:center; width:100%; margin-bottom:clamp(8px,1.4vh,14px); }
  .chip {
    font-family:monospace; font-size:clamp(.66rem,1.3vw,.95rem); padding:clamp(7px,1.2vh,12px) clamp(12px,2vw,20px);
    border-radius:20px; border:1.5px solid #1f2a56; background:#ffffff; color:#1a1a1a;
    cursor:pointer; touch-action:manipulation;
  }
  .chip.sel { background:#1f2a56; border-color:#1f2a56; color:#ffffff; }
  #notes-input {
    width:100%; font-size:clamp(.85rem,1.8vw,1.2rem); padding:clamp(10px,1.8vh,18px); border-radius:12px;
    border:1.5px solid #1f2a56; background:#ffffff; color:#1a1a1a;
    font-family:Arial,sans-serif; text-align:center; margin-top:clamp(4px,1vh,8px);
  }
  #notes-input:focus { outline:none; border-color:#c8102e; }

  /* Big-party stepper (9-35) */
  #big-party-row { display:none; align-items:center; justify-content:center; gap:clamp(14px,2vw,24px); margin-top:clamp(10px,1.6vh,16px); width:100%; }
  #big-party-row.show { display:flex; }
  .step-btn {
    width:clamp(52px,7vw,80px); height:clamp(48px,6.5vw,72px); border-radius:14px;
    border:1.5px solid #1f2a56; background:#ffffff; color:#1a1a1a;
    font-size:clamp(1.4rem,2.6vw,2rem); font-weight:bold; font-family:monospace;
    cursor:pointer; touch-action:manipulation;
  }
  #big-count {
    min-width:clamp(80px,10vw,120px); text-align:center;
    font-family:monospace; font-weight:bold; font-size:clamp(1.4rem,3vw,2.2rem); color:#1a1a1a;
    border:1.5px solid #1f2a56; border-radius:14px; padding:clamp(8px,1.2vh,14px) 0; background:#ffffff;
  }

  /* High-chair counter */
  #hc-row { display:flex; align-items:center; justify-content:center; gap:clamp(10px,1.5vw,16px); width:100%; margin-bottom:clamp(8px,1.4vh,14px); }
  #hc-label { font-family:monospace; font-size:clamp(.7rem,1.4vw,1rem); color:#5e6577; letter-spacing:.04em; }
  .hc-btn {
    width:clamp(40px,5vw,56px); height:clamp(38px,4.6vw,50px); border-radius:12px;
    border:1.5px solid #1f2a56; background:#ffffff; color:#1a1a1a;
    font-size:clamp(1.1rem,2vw,1.5rem); font-weight:bold; font-family:monospace;
    cursor:pointer; touch-action:manipulation;
  }
  #hc-count {
    min-width:clamp(44px,5vw,60px); text-align:center; font-family:monospace; font-weight:bold;
    font-size:clamp(1rem,2vw,1.4rem); color:#1a1a1a;
    border:1.5px solid #1f2a56; border-radius:12px; padding:clamp(5px,.9vh,9px) 0; background:#ffffff;
  }

  /* Animated confirmation checkmark */
  #check-svg { width:clamp(90px,16vw,150px); height:clamp(90px,16vw,150px); margin-bottom:clamp(10px,1.5vh,18px); }
  .check-circle { fill:none; stroke:#1a1a1a; stroke-width:4; stroke-dasharray:283; stroke-dashoffset:283; }
  .check-mark   { fill:none; stroke:#c8102e; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:60; stroke-dashoffset:60; }
  #screen-confirm.show .check-circle { animation: draw-circle .5s ease forwards; }
  #screen-confirm.show .check-mark   { animation: draw-check .35s .45s ease forwards; }
  #screen-confirm.show { animation: confirm-pop .4s ease; }
  @keyframes draw-circle { to { stroke-dashoffset:0; } }
  @keyframes draw-check  { to { stroke-dashoffset:0; } }
  @keyframes confirm-pop { from { transform:scale(.9); opacity:0; } to { transform:scale(1); opacity:1; } }
  #confirm-wait {
    font-size:clamp(.78rem,1.6vw,1.1rem); color:#5e6577; font-family:monospace; margin-top:-18px; margin-bottom:clamp(18px,3vh,32px);
  }

  /* Idle attract screen — styled like a crawfish-boil red envelope */
  #attract-screen {
    position:fixed; inset:0; z-index:500; overflow:hidden;
    background:linear-gradient(135deg, #c8102e 0%, #9c0c22 100%);
    box-shadow:inset 0 0 0 8px #9c0c22, inset 0 0 0 11px #1f2a56;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .4s ease;
    text-align:center; padding:24px;
  }
  #attract-screen.show { opacity:1; pointer-events:all; }
  #attract-badge {
    width:clamp(240px,46vw,440px); height:clamp(80px,15vw,150px);
    border-radius:24px; background:#ffffff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 3px #ffffff, 0 0 0 7px #1f2a56, 0 8px 20px rgba(0,0,0,.25);
    margin-bottom:clamp(20px,3vh,36px); padding:clamp(16px,2.5vw,26px) clamp(22px,3.5vw,36px);
    position:relative; z-index:1;
  }
  #attract-screen img { max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; display:block; }
  #attract-title {
    font-family:'Cormorant Garamond', Georgia, serif; font-weight:600;
    font-size:clamp(1.8rem,5vw,3.4rem); color:#e9edf7; margin-bottom:clamp(8px,1.4vh,16px);
    position:relative; z-index:1;
  }
  #attract-sub {
    font-size:clamp(1rem,2.2vw,1.5rem); color:#ffffff; font-family:monospace;
    animation: attract-pulse 1.6s ease-in-out infinite;
    position:relative; z-index:1;
  }
  @keyframes attract-pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
</style>
</head>

      labelName: 'TU NOMBRE',
      labelParty: 'TAMAÑO DEL GRUPO',

  var lang = 'en';

  var nameInput   = document.getElementById('name-input');
  var phoneInput  = document.getElementById('phone-input');
  var notesInput  = document.getElementById('notes-input');
  var partyRow    = document.getElementById('party-row');
  var chipRow     = document.getElementById('chip-row');
  var submitBtn   = document.getElementById('submit-btn');
  var errEl       = document.getElementById('err');
  var waitCountEl = document.getElementById('wait-count');
  var screenForm    = document.getElementById('screen-form');
  var screenConfirm = document.getElementById('screen-confirm');
  var confirmName  = document.getElementById('confirm-name');
  var confirmAhead = document.getElementById('confirm-ahead');
  var confirmWait  = document.getElementById('confirm-wait');
  var newSignin   = document.getElementById('new-signin');
  var langToggle  = document.getElementById('lang-toggle');
  var attractScreen = document.getElementById('attract-screen');
  var attractTitle  = document.getElementById('attract-title');
  var attractSub    = document.getElementById('attract-sub');

  var selectedParty = null;
  var selectedChips = new Set();
  var currentWaitingCount = 0;
  var currentEstimate = null;
  var resetTimer = null;

  function applyLang() {
    var t = LANG[lang];
    document.getElementById('t-welcome').textContent = t.welcome;
    document.getElementById('t-label-name').textContent = t.labelName;
    document.getElementById('t-label-party').textContent = t.labelParty;
    document.getElementById('t-label-phone').textContent = t.labelPhone;
    document.getElementById('t-label-notes').textContent = t.labelNotes;
    document.getElementById('t-hc').textContent = t.hcLabel;
    notesInput.placeholder = t.notesPlaceholder;
    submitBtn.textContent = t.submit;
    document.getElementById('confirm-msg').textContent = t.confirmMsg;
    newSignin.textContent = t.newSignin;
    document.getElementById('auto-note').textContent = t.autoNote;
    attractTitle.textContent = t.attractTitle;
    attractSub.textContent = t.attractSub;
    langToggle.textContent = t.langBtn;
    chipRow.querySelectorAll('.chip').forEach(function(b){
      var span = b.querySelector('span');
      span.textContent = lang==='en' ? b.getAttribute('data-tag-en') : b.getAttribute('data-tag-es');
    });
    renderWaitCount();
  }
  langToggle.addEventListener('click', function(){
    lang = lang==='en' ? 'es' : 'en';
    applyLang();
  });

  // ── Estimated wait: cross-references real table turnover + open tables ──
  var tablesRef     = firebase.database().ref('cajun/tables');
  var tableTurnsRef = firebase.database().ref('cajun/tableTurns');
  var totalTablesRef = firebase.database().ref('cajun/meta/totalTables');
  var largeTablesRef = firebase.database().ref('cajun/meta/largeTables');
  var liveTables = {};
  var avgTurnMinutes = null;
  var totalTables = 62; // fallback default; kept in sync with the floor plan via cajun/meta/totalTables
  var largeTableIds = ['B6','B7','B8','B9','C6','C7','D11','D12']; // 6-tops; kept in sync via cajun/meta/largeTables

  function computeHistoricalEstimate(data) {
    var seated = Object.keys(data)
      .map(function(id){ return data[id]; })
      .filter(function(e){ return e.status==='seated' && e.seatedAt && e.joinedAt; });
    seated.sort(function(a,b){ return b.seatedAt - a.seatedAt; });
    var recent = seated.slice(0, 8);
    if (recent.length===0) return null;
    var avgMs = recent.reduce(function(sum,e){ return sum+(e.seatedAt-e.joinedAt); }, 0) / recent.length;
    return Math.max(1, Math.round(avgMs/60000));
  }

  // When a dedicated large-table pool exists (cajun/meta/largeTables), parties of 5+
  // are computed against it; with no large pool, everything shares one pool.
  function poolEstimate(totalInPool, occupiedEntries, waitingCount) {
    if (avgTurnMinutes===null || totalInPool===0) return null;
    var openCount = totalInPool - occupiedEntries.length;

    if (openCount > waitingCount) {
      return Math.min(avgTurnMinutes, 5);
    }

    var soonest = avgTurnMinutes;
    occupiedEntries.forEach(function(t){
      if (!t || !t.started) return;
      var elapsedMin = (Date.now()-t.started)/60000;
      var remaining = avgTurnMinutes - elapsedMin;
      if (remaining < soonest) soonest = remaining;
    });
    soonest = Math.max(0, soonest);

    var slotsNeeded = (waitingCount+1) - openCount;
    if (slotsNeeded < 1) slotsNeeded = 1;
    var est = soonest + (slotsNeeded-1)*avgTurnMinutes;
    return Math.max(1, Math.round(est));
  }

  function computeSmartEstimate() {
    var hist = computeHistoricalEstimate(latestWlData);
    if (avgTurnMinutes===null) return { small: hist, large: hist };

    var waitingEntries = Object.keys(latestWlData)
      .filter(function(id){ return latestWlData[id].status==='waiting'; })
      .map(function(id){ return latestWlData[id]; });

    // Single-pool mode: no large-table section configured
    if (largeTableIds.length===0) {
      var allOccupied = Object.keys(liveTables).map(function(id){ return liveTables[id]; });
      var all = poolEstimate(totalTables, allOccupied, waitingEntries.length);
      return { small: all, large: all };
    }

    var smallWaiting = waitingEntries.filter(function(e){ return (e.party||1)<=4; }).length;
    var largeWaiting = waitingEntries.filter(function(e){ return (e.party||1)>4; }).length;

    var occupiedIds = Object.keys(liveTables);
    var largeOccupied = occupiedIds.filter(function(id){ return largeTableIds.indexOf(id)!==-1; }).map(function(id){ return liveTables[id]; });
    var smallOccupied = occupiedIds.filter(function(id){ return largeTableIds.indexOf(id)===-1; }).map(function(id){ return liveTables[id]; });

    var largeTotal = largeTableIds.length;
    var smallTotal = totalTables - largeTotal;

    return {
      small: poolEstimate(smallTotal, smallOccupied, smallWaiting),
      large: poolEstimate(largeTotal, largeOccupied, largeWaiting)
    };
  }

  function pickEstimateForParty(pools) {
    if (!pools) return null;
    if (largeTableIds.length===0) return pools.small;
    return (selectedParty!==null && selectedParty>4) ? pools.large : pools.small;
  }

  function renderWaitCount() {
    var t = LANG[lang];
    if (currentWaitingCount===0) {
      waitCountEl.textContent = t.waitNone;
    } else {
      var txt = t.waitSuffix(currentWaitingCount);
      if (currentEstimate!==null) txt += t.estSuffix(currentEstimate);
      waitCountEl.textContent = txt;
    }
  }

  var latestWlData = {};
  function recomputeEstimate() {
    var pools = computeSmartEstimate();
    currentEstimate = pickEstimateForParty(pools);
    renderWaitCount();
  }

  // Live count of people currently waiting
  wlRef.on('value', function(snap) {
    latestWlData = snap.val() || {};
    var n = 0;
    Object.keys(latestWlData).forEach(function(id){ if (latestWlData[id].status==='waiting') n++; });
    currentWaitingCount = n;
    recomputeEstimate();
  });

  // Live table occupancy (read-only here — the floor plan app owns writes)
  tablesRef.on('value', function(snap) {
    liveTables = snap.val() || {};
    recomputeEstimate();
  });

  // Rolling average of how long a table stays occupied, learned from real seatings
  tableTurnsRef.orderByChild('at').limitToLast(10).on('value', function(snap) {
    var vals = snap.val();
    if (!vals) { avgTurnMinutes = null; }
    else {
      var durations = Object.keys(vals).map(function(k){ return vals[k].duration; });
      var avgMs = durations.reduce(function(a,b){ return a+b; }, 0) / durations.length;
      avgTurnMinutes = Math.max(1, Math.round(avgMs/60000));
    }
    recomputeEstimate();
  });

  totalTablesRef.on('value', function(snap){
    var v = snap.val();
    if (v) totalTables = v;
    recomputeEstimate();
  });

  largeTablesRef.on('value', function(snap){
    var v = snap.val();
    largeTableIds = v || [];
    recomputeEstimate();
  });

  // Refresh the estimate every 30s even with no new events, since elapsed time keeps moving
  setInterval(recomputeEstimate, 30000);

  var bigRow = document.getElementById('big-party-row');
  var bigCount = document.getElementById('big-count');
  var bigVal = 9;
  function setBig(v){
    bigVal = Math.max(9, Math.min(35, v));
    bigCount.textContent = bigVal;
    if (selectedParty!==null && selectedParty>=9) { selectedParty = bigVal; validate(); recomputeEstimate(); }
  }
  partyRow.querySelectorAll('.party-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      partyRow.querySelectorAll('.party-btn').forEach(function(b){ b.classList.remove('sel'); });
      btn.classList.add('sel');
      var n = btn.getAttribute('data-n');
      if (n==='big') {
        bigRow.classList.add('show');
        selectedParty = bigVal;
      } else {
        bigRow.classList.remove('show');
        selectedParty = parseInt(n);
      }
      validate();
      recomputeEstimate();
    });
  });
  document.getElementById('big-minus').addEventListener('click', function(){ setBig(bigVal-1); });
  document.getElementById('big-plus').addEventListener('click', function(){ setBig(bigVal+1); });

  var hcVal = 0;
  var hcCountEl = document.getElementById('hc-count');
  function setHc(v){ hcVal = Math.max(0, Math.min(10, v)); hcCountEl.textContent = hcVal; }
  document.getElementById('hc-minus').addEventListener('click', function(){ setHc(hcVal-1); });
  document.getElementById('hc-plus').addEventListener('click', function(){ setHc(hcVal+1); });

  chipRow.querySelectorAll('.chip').forEach(function(b){
    b.addEventListener('click', function(){
      var key = b.getAttribute('data-tag-en');
      if (selectedChips.has(key)) { selectedChips.delete(key); b.classList.remove('sel'); }
      else { selectedChips.add(key); b.classList.add('sel'); }
    });
  });

  nameInput.addEventListener('input', validate);
  phoneInput.addEventListener('input', validate);
  function validate() {
    var ok = nameInput.value.trim().length>0 && selectedParty!==null && phoneInput.value.trim().length>0;
    submitBtn.disabled = !ok;
  }

  submitBtn.addEventListener('click', function(){
    var name = nameInput.value.trim();
    if (!name || !selectedParty) return;
    submitBtn.disabled = true;
    errEl.textContent = '';

    var ahead = currentWaitingCount;
    var estAtSubmit = currentEstimate;
    var notesParts = Array.from(selectedChips);
    if (hcVal>0) notesParts.unshift(lang==='en'
      ? (hcVal+' high chair'+(hcVal===1?'':'s'))
      : (hcVal+' silla'+(hcVal===1?'':'s')+' alta'+(hcVal===1?'':'s')));
    var freeNote = notesInput.value.trim();
    if (freeNote) notesParts.push(freeNote);

    var entry = {
      name: name,
      party: selectedParty,
      phone: phoneInput.value.trim(),
      notes: notesParts.join(', '),
      status: 'waiting',
      joinedAt: firebase.database.ServerValue.TIMESTAMP
    };

    wlRef.push(entry, function(error){
      var t = LANG[lang];
      if (error) {
        errEl.textContent = t.errFail;
        submitBtn.disabled = false;
        return;
      }
      confirmName.textContent = name;
      confirmAhead.textContent = ahead;
      document.querySelector('#confirm-pos').firstChild.textContent = t.aheadLabel+' ';
      confirmWait.textContent = t.estWaitLabel(estAtSubmit);
      screenForm.classList.remove('show');
      screenConfirm.classList.add('show');

      clearTimeout(resetTimer);
      resetTimer = setTimeout(resetForm, 8000);
    });
  });

  function resetForm() {
    nameInput.value = '';
    phoneInput.value = '';
    notesInput.value = '';
    selectedParty = null;
    selectedChips.clear();
    bigRow.classList.remove('show');
    bigVal = 9; bigCount.textContent = '9';
    setHc(0);
    partyRow.querySelectorAll('.party-btn').forEach(function(b){ b.classList.remove('sel'); });
    chipRow.querySelectorAll('.chip').forEach(function(b){ b.classList.remove('sel'); });
    submitBtn.disabled = true;
    errEl.textContent = '';
    screenConfirm.classList.remove('show');
    screenForm.classList.add('show');
  }

  newSignin.addEventListener('click', function(){
    clearTimeout(resetTimer);
    resetForm();
  });

  // ── Idle attract screen ───────────────────────────────────
  var IDLE_MS = 25000;
  var lastInteraction = Date.now();

  function hideAttract() { attractScreen.classList.remove('show'); }
  function showAttract() { attractScreen.classList.add('show'); }

  ['touchstart','mousedown','keydown'].forEach(function(ev){
    document.addEventListener(ev, function(){
      lastInteraction = Date.now();
      hideAttract();
    }, true);
  });

  setInterval(function(){
    if (screenForm.classList.contains('show') && (Date.now()-lastInteraction) > IDLE_MS) {
      showAttract();
    }
  }, 2000);

  applyLang();
})();
</script>
</body>
</html>
